# OpenAI Codex Security —— 每周仓库扫描（按官方示例收敛）
#
# 这个文件曾经只有从 GitHub UI 粘贴进来的两行 steps 片段（没有 on:/jobs:），
# 于是每次 push 都是「Invalid workflow file ... A sequence was not expected」的
# 0 秒失败。现在按 openai/codex-security 的官方示例
# （github-action/examples/repository.yml）补成完整工作流，并钉住 review 过的
# 发行提交（tag npm-v0.10.0 = f465432）。
#
# 启用步骤：在仓库 Secrets 里加 CODEX_SECURITY_API_KEY 即可；没有 key 时
# preflight 会把扫描 job 标成 skipped 并打一条 notice，不再红。
name: Codex Security

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1" # 每周一 07:23 UTC

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight（有没有 API key）
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
    steps:
      - id: key
        env:
          CODEX_SECURITY_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
        run: |
          if [ -n "$CODEX_SECURITY_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Codex Security 未启用::未配置 CODEX_SECURITY_API_KEY，本次跳过扫描"
          fi

  security:
    name: Scan
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan the repository
        uses: openai/codex-security@f465432bc4c8882a8b667985a9f68045483ed796
        with:
          scope: repository
          max-cost: "5"
          fail-on-severity: none
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
