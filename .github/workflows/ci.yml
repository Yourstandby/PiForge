name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: SDK adapter boundary
        run: npm run check:sdk-imports

      - name: Test
        timeout-minutes: 5
        run: npm test

  token-guards:
    name: token guards (prefix · cache · dedupe)
    runs-on: ubuntu-latest
    # 只有配置了 secret 才会跑真实模型会话；其余护栏不需要任何凭据。
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build agent host
        run: npm run build:agent-host

      # 打包版 Host 默认跑单文件 bundle；Pi SDK 靠 `PI_BUNDLED_NODE` define 判断
      # “自己被打包过”，否则按 bundle 路径算 alias 加载用户扩展会静默失败。
      # 这条在 2026-10-25 之前只由 macOS 的 dist 脚本覆盖，这里提前到 CI。
      - name: Extension UI bridge on bundled host
        timeout-minutes: 5
        run: npm run bundle:agent-host && npm run smoke:extension-ui-bundled

      # 静态前缀 ≤7200、稳定段命中率 ≥90%、每轮新增 token 中位数 ≤200、
      # transcript 字段白名单、按需域激活 + 前缀棘轮（两种配置）。
      - name: Prefix / cache / transcript guards
        timeout-minutes: 10
        run: npm run smoke:prefix-budget

      # 工具结果去重 A/B：命中 ≥1、错误原样、请求体下降。
      - name: Tool-result dedupe A/B
        timeout-minutes: 10
        run: npm run measure:increment

      # 真实模型会话（需要仓库 secret DEEPSEEK_API_KEY；没有就跳过并说明）。
      - name: Real 30-turn session (skips without secret)
        id: long_session
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        timeout-minutes: 25
        run: npm run measure:long-session

      - name: Note when the real-session guard was skipped
        if: ${{ env.DEEPSEEK_API_KEY == '' }}
        run: echo "::notice::DEEPSEEK_API_KEY not configured — skipping measure:long-session"

  build:
    name: build (next.js)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        run: npm run build

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Electron
        run: npm run build:electron

      - name: Check packaged updater dependencies
        run: npm run check:electron-deps

      - name: Test (Windows)
        timeout-minutes: 10
        shell: bash
        run: npm run test:windows

  test-macos:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Electron
        run: npm run build:electron

      - name: Check packaged updater dependencies
        run: npm run check:electron-deps

      - name: Test (macOS)
        timeout-minutes: 10
        run: npm run test:macos
