appId: com.piforge.desktop
productName: PiForge
copyright: Copyright © 2026 PiForge

directories:
  output: release
  buildResources: build

# GitHub release assets are unreliable from mainland China; use the npmmirror
# mirror for the Electron binary. For helper binaries (winCodeSign/nsis) export
# ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

files:
  - package.json
  # Runtime brand icons: BrowserWindow / tray resolve them from the asar
  # (electron/app-icon.ts). Keep every platform's file here.
  - build/icon.ico
  - build/icon.icns
  - build/icon.png
  - electron/dist/**/*
  - "!electron/**/*.ts"
  - "!electron/tsconfig.json"
  # P1-4：asar 里只放编译后的 Main/Preload 与图标。
  # UI 依赖（radix-ui / lucide-react / shadcn / ws …）已被 Next 打进静态产物，
  # 运行时不再需要它们的 node_modules —— 0.9.0 的 app.asar 有 80MB，其中约 77MB
  # 是这些永远不会被 require 的包。真正需要的 electron-updater 及其依赖已经通过
  # 下面的 extraResources 单独放进 resources/app/node_modules。
  - "!node_modules/**"

extraResources:
  # ---- P1-4：静态直出（`piforge://app`），不再有 127.0.0.1:30141 的 Next 服务 ----
  # `out/` 是 `next build`（output: "export"）的产物：HTML + `_next/static` + public。
  - from: out
    to: static
    filter:
      - "**/*"
      # 导出目录里的 RSC 预取文本与 sourcemap 不参与运行。
      - "!**/*.map"
  # Agent Host：稳定入口 + 编译后的 contract/lib。
  # 运行时依赖（Pi SDK、pi-mcp、typebox…）来自下面的 standalone/node_modules。
  - from: .next/standalone/agent-host
    to: standalone/agent-host
    filter:
      - "**/*"
  # 只留宿主进程真正需要的依赖树：standalone 里的 server.js / .next / public
  # 已经不参与运行（静态直出取代了它们），不再打包。
  - from: .next/standalone/node_modules
    to: standalone/node_modules
  - from: node_modules/electron-updater
    to: app/node_modules/electron-updater
  - from: node_modules/builder-util-runtime
    to: app/node_modules/builder-util-runtime
  - from: node_modules/fs-extra
    to: app/node_modules/fs-extra
  - from: node_modules/graceful-fs
    to: app/node_modules/graceful-fs
  - from: node_modules/jsonfile
    to: app/node_modules/jsonfile
  - from: node_modules/js-yaml
    to: app/node_modules/js-yaml
  - from: node_modules/lazy-val
    to: app/node_modules/lazy-val
  - from: node_modules/lodash.escaperegexp
    to: app/node_modules/lodash.escaperegexp
  - from: node_modules/lodash.isequal
    to: app/node_modules/lodash.isequal
  - from: node_modules/semver
    to: app/node_modules/semver
  - from: node_modules/tiny-typed-emitter
    to: app/node_modules/tiny-typed-emitter
  - from: node_modules/universalify
    to: app/node_modules/universalify
  - from: node_modules/debug
    to: app/node_modules/debug
  - from: node_modules/sax
    to: app/node_modules/sax
  - from: node_modules/argparse
    to: app/node_modules/argparse
  - from: node_modules/ms
    to: app/node_modules/ms

asar: true

npmRebuild: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: "PiForge-${version}-win-${arch}.${ext}"
  icon: build/icon.ico
  # electron-builder 只有在 rcedit 这一步（signAndEditExecutable）运行时，
  # 才会把 build/icon.ico 与版本信息写进 PiForge.exe。之前这里是 false，
  # 结果 win-unpacked/PiForge.exe 一直停留在默认 Electron 图标。
  # 首次打包需要下载 winCodeSign（含 rcedit）；国内网络请先设置：
  #   PowerShell: $env:ELECTRON_BUILDER_BINARIES_MIRROR="https://npmmirror.com/mirrors/electron-builder-binaries/"
  signAndEditExecutable: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PiForge
  uninstallDisplayName: PiForge
  artifactName: "PiForge-Setup-${version}.${ext}"
  include: build/installer.nsh

linux:
  executableName: piforge
  syncDesktopName: true
  maintainer: "PiForge"
  target:
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Development
  artifactName: "PiForge-${version}-linux-${arch}.${ext}"

mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  icon: build/icon.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  # Standalone contains architecture-specific native packages side-by-side.
  # They are identical in both intermediate apps and must not be lipo'd by
  # @electron/universal; runtime package resolution selects the right arch.
  # Brace includes standalone/.next: minimatch skips dotdirs unless named.
  # NFT copies native addons under hashed pi-coding-agent there; both arch
  # builds contain the same .node/.dylib and must not be lipo'd.
  x64ArchFiles: "Contents/Resources/standalone{,/.next}/**/{@earendil-works/pi-tui/native/darwin/prebuilds/**,@mariozechner/clipboard-darwin-{arm64,x64}/**,@img/sharp-darwin-{arm64,x64}/**,@img/sharp-libvips-darwin-{arm64,x64}/**,@esbuild/darwin-{arm64,x64}/**}"
  artifactName: "PiForge-${version}-mac-${arch}.${ext}"

dmg:
  title: "PiForge ${version}"

# Update source is fixed at build time: electron-builder writes app-update.yml
# with this GitHub Releases feed, and electron/main.ts never calls setFeedURL.
# Changing the feed requires a new build, not an env var or runtime toggle.
publish:
  provider: github
  owner: Yourstandby
  repo: PiForge
  releaseType: release
