<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src data:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在启动 PiForge…</title>
    <style>
      /* PiForge 品牌启动页 —— 暖纸底色、极简几何、黄黑 P 标。
         时间线：0ms Logo 自下淡入缩放 → 760ms 文字浮现 → 1100ms 起高光循环扫过。
         加载完成后由 startup.js 的 __piforgeFadeOut() 平滑淡出。 */
      :root {
        color-scheme: light;
        --paper: #fdf8ec;
        --paper-warm: #f7ecd4;
        --ink: #241d0e;
        --ink-soft: #6a6152;
        --ink-faint: #a89a83;
        --brand: #f5b70a;
        --brand-deep: #b77c04;
        --danger: #c2554e;
        --mark-size: 92px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(120% 110% at 50% 0%, #fffaf0 0%, var(--paper) 42%, var(--paper-warm) 100%);
        color: var(--ink-soft);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 240ms ease;
        will-change: opacity;
      }

      /* 加载完成后的平滑淡出（由主进程调用 __piforgeFadeOut） */
      body.is-leaving {
        opacity: 0;
      }

      main {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* ---- 极简几何背景：一枚圆环 + 一枚倾斜方块 ---- */
      .geo {
        position: absolute;
        pointer-events: none;
      }

      .geo-ring {
        right: -130px;
        bottom: -150px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        border: 1px solid rgba(183, 124, 4, 0.16);
        animation: geo-drift 14s ease-in-out infinite;
      }

      .geo-square {
        left: -52px;
        top: -40px;
        width: 132px;
        height: 132px;
        border-radius: 30px;
        border: 1px solid rgba(183, 124, 4, 0.13);
        transform: rotate(18deg);
        animation: geo-drift 18s ease-in-out infinite reverse;
      }

      @keyframes geo-drift {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        50% { transform: translate3d(-6px, -8px, 0) rotate(6deg); }
      }

      .geo-square {
        /* keep its own resting rotation while drifting */
        animation-name: geo-drift-square;
      }

      @keyframes geo-drift-square {
        0%, 100% { transform: rotate(18deg) translate3d(0, 0, 0); }
        50% { transform: rotate(24deg) translate3d(6px, 8px, 0); }
      }

      /* ---- Logo：自下而上淡入 + 缩放，随后持续轻微浮动 ---- */
      .mark-enter {
        animation: mark-in 820ms var(--ease-out) both;
        /* 只跑合成层属性，避免启动阶段任何 reflow / filter 重绘 */
        will-change: transform, opacity;
      }

      .mark-float {
        animation: mark-float 5.2s 900ms ease-in-out infinite;
      }

      @keyframes mark-in {
        0% {
          opacity: 0;
          transform: translate3d(0, 26px, 0) scale(0.86);
        }
        60% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes mark-float {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(0, -5px, 0); }
      }

      .mark {
        position: relative;
        width: var(--mark-size);
        height: var(--mark-size);
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
          0 22px 40px -22px rgba(146, 102, 0, 0.55),
          0 3px 8px rgba(146, 102, 0, 0.16);
      }

      .mark-logo {
        display: block;
        width: 100%;
        height: 100%;
        -webkit-user-drag: none;
      }

      /* 高光扫过（Shimmer）：循环，营造“打磨过的质感” */
      .mark-sheen {
        position: absolute;
        inset: -40% -70%;
        background: linear-gradient(
          102deg,
          transparent 38%,
          rgba(255, 255, 255, 0.9) 50%,
          transparent 62%
        );
        animation: sheen 3.2s 1100ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
        pointer-events: none;
      }

      @keyframes sheen {
        0% { transform: translateX(-78%); }
        55%, 100% { transform: translateX(78%); }
      }

      /* ---- 文字：缓缓浮现 ---- */
      .wordmark {
        display: flex;
        margin: 26px 0 0;
        font-size: 19px;
        font-weight: 600;
        color: var(--ink);
        animation: word-in 900ms 740ms var(--ease-out) both;
      }

      .wordmark-accent {
        color: var(--brand-deep);
      }

      @keyframes word-in {
        0% {
          opacity: 0;
          transform: translateY(10px);
          letter-spacing: 0.2em;
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          letter-spacing: 0.01em;
        }
      }

      .status {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 10px 0 0;
        font-size: 11.5px;
        letter-spacing: 0.02em;
        color: var(--ink-faint);
        animation: fade-in 700ms 1180ms ease-out both;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--brand);
        animation: dot-pulse 1.8s ease-out infinite;
      }

      @keyframes dot-pulse {
        0% { box-shadow: 0 0 0 0 rgba(245, 183, 10, 0.5); }
        70% { box-shadow: 0 0 0 7px rgba(245, 183, 10, 0); }
        100% { box-shadow: 0 0 0 0 rgba(245, 183, 10, 0); }
      }

      /* ---- 错误 / 已停止：暖色卡片，正常启动时完全隐藏 ---- */
      .error-details {
        max-height: 0;
        opacity: 0;
        visibility: hidden;
        transform: translateY(12px);
        width: min(420px, calc(100vw - 40px));
        margin-top: 0;
        transition: all 480ms var(--ease-out);
      }

      #panel.error .error-details,
      #panel.stopped .error-details {
        max-height: 280px;
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        margin-top: 22px;
      }

      #panel.error .status,
      #panel.stopped .status,
      #panel.error .mark-sheen,
      #panel.stopped .mark-sheen {
        display: none;
      }

      #panel.error .mark-float,
      #panel.stopped .mark-float {
        animation: none;
      }

      .error-box {
        padding: 16px 18px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(194, 85, 78, 0.24);
        box-shadow: 0 14px 32px -20px rgba(120, 50, 46, 0.4);
        text-align: center;
      }

      .error-box h2 {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--danger);
      }

      .error-box p {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.65;
        color: var(--ink-soft);
      }

      /* 尊重系统的「减少动态效果」偏好：全部动画退化为静态画面 */
      @media (prefers-reduced-motion: reduce) {
        .mark-enter,
        .mark-float,
        .wordmark,
        .status,
        .mark-sheen,
        .status-dot,
        .geo-ring,
        .geo-square {
          animation: none;
        }
        .mark-enter,
        .wordmark,
        .status {
          opacity: 1;
          transform: none;
          filter: none;
        }
        .mark-sheen {
          display: none;
        }
      }
    </style>
  </head>
